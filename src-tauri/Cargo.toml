[package]
name = "tilde"
description = "A modern, SSH-first terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "tilde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tilde-config = { path = "../crates/tilde-config" }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dirs = "7"
tilde-pty = { path = "../crates/tilde-pty" }
tilde-session = { path = "../crates/tilde-session" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tilde-ssh = { path = "../crates/tilde-ssh" }
tilde-monitor = { path = "../crates/tilde-monitor" }
tauri-plugin-updater = "2"
tilde-ssh-config = { path = "../crates/tilde-ssh-config" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tauri-plugin-global-shortcut = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
winreg = "0.56"


[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
