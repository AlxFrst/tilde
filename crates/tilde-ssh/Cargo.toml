[package]
name = "tilde-ssh"
description = "SSH client for Tilde: connection chain, authentication, known_hosts, forwarding"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64 = "0.22"
dirs = "7"
hmac = "0.12"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
sha1 = "0.10"
thiserror = "2"
tracing = "0.1"

[features]
# Integration tests against the Docker SSH bench (tests/docker).
integration = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
