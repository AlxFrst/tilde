# Tunnels declared in ssh_config.
Host tunnels
    HostName gw.example.com
    User tunnel
    LocalForward 5432 db.internal:5432
    LocalForward 127.0.0.1:8080 web.internal:80
    LocalForward [::1]:9000 [::1]:22
    RemoteForward 0.0.0.0:9090 localhost:3000
    RemoteForward 1080
    DynamicForward 1081
    ExitOnForwardFailure yes

Host *
    LocalForward 5432 db.internal:5432
    RemoteForward 9091 localhost:3001
