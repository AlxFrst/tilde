# OpenSSH for Windows style: drive letters and backslashes.
Host devbox
    HostName devbox.lan
    User Alex
    IdentityFile C:\Users\Alex\.ssh\id_ed25519
    IdentityFile "C:\Users\Alex Smith\.ssh\work key"
    UserKnownHostsFile C:\Users\Alex\.ssh\known_hosts_devbox
    ProxyCommand C:\Windows\System32\OpenSSH\ssh.exe -W %h:%p jump.lan

Host wsl
    HostName localhost
    Port 2222
    IdentityFile ~/.ssh/wsl_key
    StrictHostKeyChecking no

Host *
    IdentityFile C:/Users/Alex/.ssh/id_rsa
