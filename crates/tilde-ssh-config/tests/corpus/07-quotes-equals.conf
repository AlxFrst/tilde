# Quotes, "=" separators, tabs and trailing comments.
Host=quoted
	HostName = "quoted.example.com"
	User="deploy user"
	IdentityFile "~/.ssh/key with spaces"
	Port=2200 # admin port
	LocalForward "8080" "localhost:80"

Host "spaced"	tabbed  other
	HostName	%h.example.com
	SetEnv FOO="bar baz"
	IdentityFile ~/.ssh/escaped\ space
	StrictHostKeyChecking=yes

HOST Upper
	PORT	2201
