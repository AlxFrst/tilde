# Personal and work GitHub accounts, plus GitLab, with one key each.
IgnoreUnknown UseKeychain

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/github_personal
    IdentitiesOnly yes

Host github-work
    HostName github.com
    User git
    IdentityFile ~/.ssh/github_work
    IdentitiesOnly yes

Host gitlab.com gitlab-work
    User git
    PreferredAuthentications publickey
Host gitlab-work
    HostName gitlab.com
    IdentityFile ~/.ssh/gitlab_work

Host *
    AddKeysToAgent yes
    UseKeychain yes
    IdentityFile ~/.ssh/id_ed25519
