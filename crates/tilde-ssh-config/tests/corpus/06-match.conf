# Match blocks of every supported kind.
Host jump
    HostName jump.corp.example

Host wiki.corp
Host build-01
    HostName 10.1.2.3
Host build-02
    HostName 10.1.2.4
    User root

Match originalhost *.corp,build-*,!jump
    ProxyJump jump

# Only when the remote user is root at this point.
Match host 10.1.* user root
    User admin

Match host *.corp.example,10.1.*
    Port 2022

Match localuser alice originalhost build-*
    IdentityFile ~/.ssh/ci_%u

# Tilde cannot run commands: reported, never matches (here ssh agrees, the file
# does not exist).
Match originalhost *.corp exec "test -f /nonexistent/tilde-vpn-up"
    ProxyJump none

# Evaluated in OpenSSH's final pass, against the final host name.
Match final host 10.*
    ConnectTimeout 3

Match !originalhost jump
    ForwardAgent no

Match all
    ServerAliveInterval 45
