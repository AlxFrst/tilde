# A very common mistake: "Host *" at the top. Since the first value obtained wins,
# its values beat the specific blocks below; they only fill what it leaves unset.
Host *
    User admin
    ServerAliveInterval 60
    ServerAliveCountMax 3
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking accept-new

Host web1 web2
    User deploy   # never used: "Host *" already set User
    Port 2200
    IdentityFile ~/.ssh/deploy_ed25519

Host monitoring
    HostName mon.example.org
    ServerAliveInterval 5
