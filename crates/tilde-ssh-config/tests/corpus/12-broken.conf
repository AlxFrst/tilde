# corpus: no-ssh-g (ssh refuses the whole file; Tilde reports and keeps the valid hosts)
Host ok
    HostName ok.example.com

Host bad-port
    Port 99999
    User "unterminated
    User fallback

Host
    User orphan

Match localnetwork 10.0.0.0/8
    User lan

Match frobnicate yes
    User weird

Host after-errors
    HostName still.works
    ServerAliveInterval soon
    ProxyJump bob@:22
    LocalForward 8080
    IdentitiesOnly perhaps
