# Databases behind two bastions.
Host bastion-eu
    HostName bastion.eu.example.net
    User ops
    Port 2222
    IdentityFile ~/.ssh/ops_ed25519

Host bastion-db
    HostName 10.20.0.4
    User ops
    ProxyJump bastion-eu

Host db-primary db-replica
    User postgres
    ProxyJump bastion-eu,ops@bastion-db:22
    LocalForward 5432 localhost:5432

Host db-primary
    HostName 10.30.0.10
Host db-replica
    HostName 10.30.0.11
    LocalForward 5433 localhost:5432

# "ProxyJump none" wins, so the ProxyCommand below is ignored (first one wins).
Host legacy
    HostName legacy.internal
    ProxyJump none
    ProxyCommand ssh -W %h:%p bastion-eu

Host *.internal !legacy.internal
    ProxyJump ssh://ops@bastion.eu.example.net:2222

Host *
    ServerAliveInterval 20
    ServerAliveCountMax 4
    ConnectTimeout 10
