# AWS Systems Manager Session Manager, from the AWS documentation.
host i-* mi-*
    ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
    User ec2-user
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

Host i-0123456789abcdef0
    IdentityFile ~/.ssh/aws-prod.pem

# Gotcha: "Host i-*" matches the alias, not the HostName, so this one gets no
# ProxyCommand from the block above.
Host app-prod
    HostName i-0fedcba9876543210
    User ubuntu

Host app-staging
    HostName i-0aaaabbbbccccdddd
    User ubuntu
    ProxyCommand aws ssm start-session --region eu-west-3 --profile staging --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
