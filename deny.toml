# cargo-deny: license allow-list and security advisories. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported but only crates we depend on directly fail the build.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # Permissive, OSI-approved (clipboard-win via tauri-plugin-clipboard-manager).
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
