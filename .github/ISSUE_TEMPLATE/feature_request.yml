name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the actual situation where you miss it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you suggest
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
