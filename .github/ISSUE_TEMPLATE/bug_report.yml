name: Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Et qu'attendiez-vous à la place ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Tilde
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Réglages → « Ouvrir le dossier des logs ». Vérifiez qu'aucune information sensible n'y figure.
      render: json
