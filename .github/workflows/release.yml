name: Release

# A tag vX.Y.Z builds the installers on the three platforms and attaches them, with
# their SHA-256 sums, to a *draft* GitHub release that a maintainer reviews and
# publishes. A manual run on main given a `tag` does the same, creating that tag on
# its commit first. Pull requests that touch packaging, and manual runs without a
# tag, build the installers without releasing anything. See docs/release.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on this commit and release (vX.Y.Z). Empty only builds.
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - scripts/check-version.ts
      - scripts/updater-json.ts

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the one pushed, or the one a manual run creates.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}

jobs:
  prepare:
    name: Versions and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions agree (and match the tag)
        run: node scripts/check-version.ts ${TAG:+"$TAG"}
      - name: Create the tag (manual run)
        if: env.IS_TAG == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A release is cut from main, not $GITHUB_REF"; exit 1
          fi
          # A re-run finds the tag it created; the same tag on another commit is refused.
          # Created with the workflow's token, it does not start a second run.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on another commit ($existing)"; exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
      - name: Create the draft release
        id: release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # The changelog section of this version, or a pointer to the file.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          # A re-run reuses this tag's draft. A new one's id comes from the creation
          # itself: the release list does not show a draft created a moment ago.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Tilde $TAG" -F draft=true -F body=@notes.md --jq .id)
          fi
          # Without it the installers would be built and attached nowhere.
          if [ -z "$id" ]; then echo "::error::No draft release id for $TAG"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.name }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macOS
            os: macos-latest
            # `app` also yields the update archive (.app.tar.gz) that latest.json points to.
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libdbus-1-dev pkg-config file

      - name: Rust targets (universal macOS build)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Updates are signed with Tilde's updater key (minisign). Without it the build
      # skips the update artifacts instead of failing.
      - name: Updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<TILDE_EOF"
              echo "$TAURI_SIGNING_PRIVATE_KEY"
              echo "TILDE_EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "EXTRA_ARGS=$EXTRA_ARGS --config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_ENV"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no update artifacts (latest.json)."
          fi

      # Signing is optional: without the secrets the installers are built unsigned.
      - name: Windows signing certificate (if configured)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'tilde-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $config -Encoding utf8
          "EXTRA_ARGS=$env:EXTRA_ARGS --config $config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apple signing and notarization (if configured)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Exported only when present: an empty APPLE_CERTIFICATE would make the
          # bundler try (and fail) to import it.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done

      - name: Build (and attach to the draft release on a tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}
          # The release stays a draft until a maintainer publishes it.
          releaseDraft: true
          # latest.json is written once, by the last job, from every platform's files:
          # three jobs merging their own entries at once overwrote one another.
          uploadUpdaterJson: false

      - name: Keep the installers (pull requests and manual runs)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tilde-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/dmg/*.dmg

  checksums:
    name: Updater file and SHA-256 sums
    needs: [prepare, build]
    if: needs.prepare.outputs.release-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # From every platform's signatures, once all are built; the script fails if a
      # platform is missing, so an incomplete release never reaches the updater.
      - name: The updater file (latest.json)
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          mkdir sigs && cd sigs
          gh api "$api/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H 'Accept: application/octet-stream' "$api/assets/$id" > "$name"
          done
          gh api "$api/$RELEASE_ID" --jq .body > notes.md
          node ../scripts/updater-json.ts "$TAG" notes.md > ../latest.json
          cd ..
          # A re-run replaces the file.
          gh api "$api/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id' |
          while read -r id; do gh api -X DELETE "$api/assets/$id"; done
          upload_url=$(gh api "$api/$RELEASE_ID" --jq .upload_url)
          gh api -X POST -H 'Content-Type: application/json' \
            "${upload_url%\{*}?name=latest.json" --input latest.json > /dev/null
      - name: Hash the release assets
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          mkdir assets && cd assets
          gh api "$api/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name != "SHA256SUMS.txt") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H 'Accept: application/octet-stream' "$api/assets/$id" > "$name"
          done
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          cd ..
          gh api "$api/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "SHA256SUMS.txt") | .id' |
          while read -r id; do gh api -X DELETE "$api/assets/$id"; done
          upload_url=$(gh api "$api/$RELEASE_ID" --jq .upload_url)
          gh api -X POST -H 'Content-Type: text/plain' \
            "${upload_url%\{*}?name=SHA256SUMS.txt" --input SHA256SUMS.txt > /dev/null
