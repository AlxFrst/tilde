name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Front-end (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # On Linux, pull requests check the core crates only: installing WebKitGTK for the
      # Tauri app is slow and often times out. The full app is built on main.
      APP: ${{ matrix.os != 'ubuntu-22.04' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          if [ "$APP" = "true" ]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
              libayatana-appindicator3-dev patchelf libdbus-1-dev pkg-config
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev pkg-config
          fi
      # rust-toolchain.toml pins the version; rustup installs it on first cargo call.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # tauri::generate_context! needs the built front-end (frontendDist).
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          exclude=()
          [ "$APP" = "true" ] || exclude=(--exclude tilde)
          cargo clippy --workspace "${exclude[@]}" --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: |
          exclude=()
          [ "$APP" = "true" ] || exclude=(--exclude tilde)
          cargo test --workspace "${exclude[@]}"

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:types
      - run: git diff --exit-code schemas src/ipc/generated

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (with shellcheck on run scripts)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  ssh-integration:
    name: SSH integration (Docker bench)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TILDE_REQUIRE_SSH_BENCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Start the SSH test bench
        timeout-minutes: 10
        run: scripts/ssh-test-env.sh up
      - run: cargo test -p tilde-ssh --features integration -- --test-threads=4
      - name: Bench logs on failure
        if: failure()
        run: docker compose -f tests/docker/compose.yml logs --tail 200
      - if: always()
        run: scripts/ssh-test-env.sh down
